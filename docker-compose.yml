services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - JWT_SECRET=change-me-to-a-random-secret
      - JWT_EXPIRY=7d
      # OAuth (optional — leave empty to disable OAuth buttons)
      - GOOGLE_CLIENT_ID=
      - GOOGLE_CLIENT_SECRET=
      - GITHUB_CLIENT_ID=
      - GITHUB_CLIENT_SECRET=
      - OAUTH_CALLBACK_URL=http://localhost:3000
    restart: unless-stopped
