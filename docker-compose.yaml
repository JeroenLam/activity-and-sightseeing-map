services:
  backend:
    image: ghcr.io/jeroenlam/activity-and-sightseeing-map-backend:latest
    env_file: .env
    volumes:
      - db-data:/app/data
    ports:
      - "8000:8000"

  frontend:
    image: ghcr.io/jeroenlam/activity-and-sightseeing-map-frontend:latest
    build:
      context: ./frontend
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db-data:
