services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file: .env
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  frontend_mobile:
    build:
      context: ./frontend_mobile
      dockerfile: Dockerfile.dev
    environment:
      - VITE_API_URL=${VITE_API_URL:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./frontend_mobile:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - backend

